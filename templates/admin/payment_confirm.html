{% extends 'admin/model/list.html' %}

{% block tail %}
{{ super() }}
<script>
function confirmPayment(id) {
  if (!confirm('Confirm this payment and send receipt to the customer?')) return;
  fetch('/admin/payment/confirm/' + id, { method: 'POST' })
    .then(r => {
      if (r.ok) {
        alert('Payment confirmed and receipt sent.');
        location.reload();
      } else {
        alert('Something went wrong.');
      }
    });
}
</script>
{% endblock %}
