{% extends "base.html" %}
{% block title %}Create account — SkyChain{% endblock %}
{% block content %}

<svg class="stars" xmlns="http://www.w3.org/2000/svg" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0"></svg>

<section class="auth-page">
  <div class="auth-card">
    <h2>Create account</h2>
    <p class="auth-sub">Join SkyChain and book flights with crypto</p>

    <div class="auth-error" id="auth-error"></div>

    <div class="input-group">
      <label>Full name</label>
      <input type="text" id="full_name" placeholder="Ada Lovelace" />
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button class="btn-auth" onclick="register()">Create account</button>

    <div class="auth-switch">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</section>

{% endblock %}
