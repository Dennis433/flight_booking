<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkyChain{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo">SKY<span>CHAIN</span></a>
            <div class="nav-links">
                {% if session.get('user_id') %}
                    <a href="/dashboard">My bookings</a>

                    <!-- ── Notification bell ── -->
                    <div class="notif-wrap" id="notif-wrap">
                        <button class="notif-bell" id="notif-bell" onclick="toggleNotifPanel()" aria-label="Notifications">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                            <span class="notif-badge" id="notif-badge" style="display:none">0</span>
                        </button>

                        <!-- Dropdown panel -->
                        <div class="notif-panel" id="notif-panel" aria-hidden="true">
                            <div class="notif-panel-header">
                                <span>Notifications</span>
                                <button class="notif-mark-all" onclick="markAllRead()">Mark all read</button>
                            </div>
                            <div class="notif-list" id="notif-list">
                                <div class="notif-empty">No notifications yet</div>
                            </div>
                        </div>
                    </div>

                    <a href="/logout">Logout</a>
                {% else %}
                    <a href="/login">Login</a>
                    <a href="/register" class="btn-primary">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% if session.get('user_id') %}
    <style>
    /* ── Notification bell & panel ──────────────────────── */
    .notif-wrap {
        position: relative;
    }
    .notif-bell {
        position: relative;
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-2);
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
    }
    .notif-bell:hover { border-color: var(--border-h); color: var(--text); }
    .notif-badge {
        position: absolute;
        top: -5px; right: -5px;
        background: var(--blue);
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
        min-width: 16px; height: 16px;
        border-radius: 100px;
        display: flex; align-items: center; justify-content: center;
        padding: 0 3px;
        border: 2px solid var(--bg);
    }

    .notif-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 360px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        z-index: 200;
        display: none;
        overflow: hidden;
    }
    .notif-panel.open { display: block; }

    .notif-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem 0.75rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
    }
    .notif-mark-all {
        background: none;
        border: none;
        font-size: 0.72rem;
        color: var(--blue-l);
        cursor: pointer;
        padding: 0;
    }
    .notif-mark-all:hover { text-decoration: underline; }

    .notif-list {
        max-height: 420px;
        overflow-y: auto;
    }
    .notif-empty {
        padding: 2.5rem 1.25rem;
        text-align: center;
        font-size: 0.82rem;
        color: var(--text-3);
    }

    .notif-item {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: var(--surface-h); }
    .notif-item.unread { background: rgba(37,99,235,0.05); }
    .notif-item.unread::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--blue-l);
        border-radius: 0 2px 2px 0;
    }

    .notif-item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
    }
    .notif-item-title {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
    }
    .notif-item-time {
        font-size: 0.68rem;
        color: var(--text-3);
        white-space: nowrap;
        flex-shrink: 0;
    }
    .notif-item-body {
        font-size: 0.78rem;
        color: var(--text-2);
        line-height: 1.5;
    }

    .notif-type-icon {
        display: inline-block;
        width: 6px; height: 6px;
        border-radius: 50%;
        margin-right: 0.35rem;
        vertical-align: middle;
        position: relative;
        top: -1px;
    }
    .notif-type-icon.pending   { background: #f59e0b; }
    .notif-type-icon.confirmed { background: #4ade80; }

    .notif-receipt-link {
        display: inline-block;
        margin-top: 0.5rem;
        font-size: 0.72rem;
        color: var(--blue-l);
        text-decoration: none;
    }
    .notif-receipt-link:hover { text-decoration: underline; }
    </style>

    <script>
    let notifOpen = false;

    function toggleNotifPanel() {
        notifOpen = !notifOpen;
        const panel = document.getElementById('notif-panel');
        panel.classList.toggle('open', notifOpen);
        panel.setAttribute('aria-hidden', String(!notifOpen));
        if (notifOpen) loadNotifications();
    }

    // Close when clicking outside
    document.addEventListener('click', e => {
        if (notifOpen && !document.getElementById('notif-wrap').contains(e.target)) {
            notifOpen = false;
            document.getElementById('notif-panel').classList.remove('open');
        }
    });

    async function loadNotifications() {
        try {
            const res   = await fetch('/api/notifications');
            const items = await res.json();
            renderNotifications(items);
        } catch {}
    }

    function renderNotifications(items) {
        const list = document.getElementById('notif-list');
        if (!items.length) {
            list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
            return;
        }
        list.innerHTML = items.map(n => {
            const isPending   = n.type === 'payment_pending';
            const iconClass   = isPending ? 'pending' : 'confirmed';
            const unreadClass = n.read ? '' : 'unread';
            const receiptLink = n.booking_id && !isPending
                ? `<a class="notif-receipt-link" href="/confirmation/${n.booking_id}">View e-ticket →</a>`
                : (n.booking_id && isPending
                    ? `<a class="notif-receipt-link" href="/dashboard">View booking →</a>`
                    : '');
            return `
            <div class="notif-item ${unreadClass}" onclick="markRead('${n.id}', this)">
                <div class="notif-item-header">
                    <div class="notif-item-title">
                        <span class="notif-type-icon ${iconClass}"></span>${n.title}
                    </div>
                    <span class="notif-item-time">${n.created_at}</span>
                </div>
                <div class="notif-item-body">${n.body}</div>
                ${receiptLink}
            </div>`;
        }).join('');
    }

    async function markRead(id, el) {
        el.classList.remove('unread');
        await fetch('/api/notifications/read', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ id })
        });
        refreshBadge();
    }

    async function markAllRead() {
        document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
        await fetch('/api/notifications/read', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({})
        });
        refreshBadge();
    }

    async function refreshBadge() {
        try {
            const res   = await fetch('/api/notifications/unread-count');
            const data  = await res.json();
            const badge = document.getElementById('notif-badge');
            if (data.count > 0) {
                badge.textContent = data.count > 9 ? '9+' : data.count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        } catch {}
    }

    // ── Supabase Realtime — instant notification push ──────
    const SUPABASE_URL      = '{{ config.SUPABASE_URL }}';
    const SUPABASE_ANON_KEY = '{{ config.SUPABASE_ANON_KEY }}';
    const USER_ID           = '{{ session.get("user_id", "") }}';

    refreshBadge();

    if (SUPABASE_URL && SUPABASE_ANON_KEY && USER_ID) {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabase
            .channel('notifications:' + USER_ID)
            .on('postgres_changes', {
                event:  'INSERT',
                schema: 'public',
                table:  'notifications',
                filter: `user_id=eq.${USER_ID}`
            }, payload => {
                // New notification arrived — refresh badge and panel
                refreshBadge();
                if (notifOpen) loadNotifications();
                // Show a brief toast
                showNotifToast(payload.new.title);
            })
            .subscribe();
    } else {
        // Fallback: poll every 30s if Supabase config missing
        setInterval(refreshBadge, 30000);
    }

    function showNotifToast(title) {
        const toast = document.createElement('div');
        toast.className = 'notif-toast';
        toast.innerHTML = `<span class="notif-type-icon confirmed"></span>${title}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }
    </script>

    <style>
    .notif-toast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--bg-2);
        border: 1px solid var(--border-h);
        border-left: 3px solid #4ade80;
        border-radius: 10px;
        padding: 0.85rem 1.25rem;
        font-size: 0.82rem;
        color: var(--text);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        z-index: 1000;
        transform: translateY(10px);
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        max-width: 320px;
    }
    .notif-toast.show { opacity: 1; transform: translateY(0); }
    </style>
    {% endif %}
</body>
</html>
